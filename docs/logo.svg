<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="ezharness logo — orbit shell">
  <defs>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset=".5" stop-color="#00add8"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- 旋转组：轨道 + 光子（环包裹窗口 = harness 外壳） -->
  <g>
    <circle cx="100" cy="100" r="62" fill="none" stroke="url(#ringGrad)" stroke-width="4.5"
            stroke-linecap="round" stroke-dasharray="290 99" transform="rotate(-35 100 100)"/>
    <circle cx="151" cy="63" r="6.5" fill="#0369a1"/>
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100"
                      dur="16s" repeatCount="indefinite"/>
  </g>

  <!-- 中心窗口 -->
  <rect x="58" y="66" width="84" height="68" rx="11" fill="#0c4a6e"/>
  <circle cx="72" cy="79" r="2.6" fill="#7dd3fc"/>
  <circle cx="81" cy="79" r="2.6" fill="#38bdf8" opacity=".7"/>
  <circle cx="90" cy="79" r="2.6" fill="#a78bfa" opacity=".5"/>
  <rect x="70" y="90" width="46" height="5" rx="2.5" fill="#7dd3fc" opacity=".85"/>
  <rect x="70" y="102" width="60" height="5" rx="2.5" fill="#7dd3fc" opacity=".45"/>
  <rect x="70" y="114" width="34" height="5" rx="2.5" fill="#7dd3fc" opacity=".25"/>
</svg>
